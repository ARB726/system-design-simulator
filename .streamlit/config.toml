# Refined neutral foundation, adapted from Streamlit's shadcn theme.
[theme]
base = "dark"
primaryColor = "#1c6fd1"
font = "sans-serif"
baseFontSize = 16
headingFontSizes = ["44px", "28px", "22px", "18px", "16px", "14px"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "16px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f6fb"
textColor = "#17243b"
borderColor = "#dce4ef"
dataframeHeaderBackgroundColor = "#edf2f8"

[theme.light.sidebar]
backgroundColor = "#f3f6fb"
secondaryBackgroundColor = "#ffffff"

[theme.dark]
primaryColor = "#4a9af0"
backgroundColor = "#090c14"
secondaryBackgroundColor = "#141b2b"
textColor = "#e6edf7"
borderColor = "#2c3d56"
dataframeHeaderBackgroundColor = "#141b2b"

[theme.dark.sidebar]
backgroundColor = "#0d111c"
secondaryBackgroundColor = "#182033"

[browser]
gatherUsageStats = false
